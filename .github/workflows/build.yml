name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp build/outputs/apk/release/*.apk MT610Print.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MT610Print
          path: MT610Print.apk

      # Puts the APK on the repo's Releases page so it downloads straight to the phone.
      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest MT610Print.apk \
            --title "MT610 Print - latest build" \
            --notes "Built from ${GITHUB_SHA::7}. Download MT610Print.apk below and install it."
