plugins {
    id 'com.android.application' version '8.5.2'
}

android {
    namespace 'com.miguel.mt610print'
    compileSdk 34

    defaultConfig {
        applicationId 'com.miguel.mt610print'
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName '1.3'
    }

    // Fixed key committed to the repo so every new build installs over the old one.
    signingConfigs {
        shared {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.shared }
        release {
            signingConfig signingConfigs.shared
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
